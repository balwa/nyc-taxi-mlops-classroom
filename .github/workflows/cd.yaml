# CD (S0, blue-green from S3): after ci succeeds on main, deploy that commit's image to the idle colour on
# the app host through the self-hosted runner (label lab-app, instance profile: decisions/002), check it
# (decisions/011), switch traffic, and leave the old colour running for rollback.
# The job runs on the host, so it is guarded: only a push-triggered ci run of this repository's main.
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, lab-app]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      HTTP_PORT: "80"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the stack (Traefik, network, routes)
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          deploy/web.sh prepare
      - name: Deploy to the idle colour
        id: colour
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          live=$(deploy/web.sh live)
          idle=$([[ "$live" == blue ]] && echo green || echo blue)
          echo "live=$live idle=$idle"
          echo "idle=$idle" >> "$GITHUB_OUTPUT"
          # The live colour keeps the tag it runs; only the idle one moves to this commit.
          if [[ "$idle" == blue ]]; then
            BLUE_TAG="$IMAGE_TAG"
            GREEN_TAG=$(deploy/web.sh tag green)
          else
            GREEN_TAG="$IMAGE_TAG"
            BLUE_TAG=$(deploy/web.sh tag blue)
          fi
          export BLUE_TAG GREEN_TAG
          docker compose -f deploy/compose.web.yaml pull "app-$idle"
          docker compose -f deploy/compose.web.yaml up -d --wait --remove-orphans "app-$idle"
      - name: Check the idle colour (decisions/011)
        env:
          IDLE: ${{ steps.colour.outputs.idle }}
        run: |
          deploy/web.sh smoke "$IDLE" "$IMAGE_TAG"
          # Ten more quotes pinned to the idle colour: every one must be a 200 with a positive duration.
          for _ in $(seq 1 10); do
            curl -fsS -H "X-Lab-Color: $IDLE" -H 'Content-Type: application/json' http://127.0.0.1/predict \
              -d '{"pickup_zone_id": 132, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}' |
              jq -e '.duration_minutes > 0' >/dev/null
          done
          echo "$IDLE answered 10/10 quotes"
      - name: Switch traffic
        env:
          IDLE: ${{ steps.colour.outputs.idle }}
        run: |
          deploy/web.sh switch "$IDLE"
          # Traefik picks up the new weights from its file a moment after the switch, so poll for the SHA.
          for _ in $(seq 1 15); do
            out=$(curl -fsS http://127.0.0.1/version || true)
            if jq -e --arg sha "$IMAGE_TAG" '.git_sha == $sha' <<<"${out:-null}" >/dev/null 2>&1; then
              echo "$out"; break
            fi
            sleep 2
          done
          jq -e --arg sha "$IMAGE_TAG" '.git_sha == $sha' <<<"${out:-null}" >/dev/null ||
            { echo "live route answers ${out:-nothing}, expected $IMAGE_TAG" >&2; exit 1; }
          deploy/web.sh status
