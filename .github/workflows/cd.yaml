# S0 CD: after ci succeeds on main, deploy that commit's image on the app host through the self-hosted
# runner (label lab-app, instance profile: decisions/002), then smoke-test /version.
# The job runs on the host, so it is guarded: only a push-triggered ci run of this repository's main.
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, lab-app]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker compose -f deploy/compose.app.yaml pull
          docker compose -f deploy/compose.app.yaml up -d --wait --remove-orphans
      - name: Smoke test /version
        run: |
          out=$(curl -fsS --retry 10 --retry-all-errors --retry-delay 3 http://127.0.0.1/version)
          echo "$out"
          echo "$out" | jq -e --arg sha "$IMAGE_TAG" '.git_sha == $sha'
