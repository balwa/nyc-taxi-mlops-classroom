# App rollback without a deploy: send traffic back to the other colour, which is still running the
# previous version (deploy/web.sh switch). Manual, in the `production` environment so it waits for you.
# Push-triggered workflows never reach it, and workflow_dispatch needs write access to the repository.
name: rollback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: [self-hosted, lab-app]
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Switch to the other colour
        run: |
          live=$(deploy/web.sh live)
          other=$([[ "$live" == blue ]] && echo green || echo blue)
          [[ "$(deploy/web.sh tag "$other")" != none ]] || { echo "$other isn't running: nothing to roll back to" >&2; exit 1; }
          start=$(date +%s)
          deploy/web.sh smoke "$other"
          want=$(deploy/web.sh status | jq -r --arg c "$other" '.git_shas[$c]')
          deploy/web.sh switch "$other"
          # The clock stops when the live route answers with the other colour's commit, not when the
          # switch command returns: Traefik picks up the new weights a moment later.
          for _ in $(seq 1 60); do
            out=$(curl -fsS http://127.0.0.1/version || true)
            if jq -e --arg sha "$want" '.git_sha == $sha' <<<"${out:-null}" >/dev/null 2>&1; then
              echo "$out"
              echo "rolled back $live -> $other in $(( $(date +%s) - start )) s, until the live route answered with it"
              deploy/web.sh status
              exit 0
            fi
            sleep 1
          done
          echo "live route answers ${out:-nothing}, expected $want" >&2
          exit 1
